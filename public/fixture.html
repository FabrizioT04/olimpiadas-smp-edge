  function filtrarPartidos(fechaFiltro, btn) {

    document.querySelectorAll('.container-fixture-days .btn-glass').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const panel = document.getElementById('panelPartidos');
    
    // Filtramos la base de datos cruzando de forma rígida la semana y el día
    const filtrados = dbPartidos.filter(p => p.s === semanaActiva && p.f === fechaFiltro && p.e.trim() !== "");

    let html = '';
    
    if (filtrados.length === 0) {
      panel.innerHTML = `
        <div style="text-align:center; padding:40px; color:#475569; font-size:13px; font-weight:600;">

        </div>`;
      return;
    }

    filtrados.forEach(p => {
      let colorEstado = semanaActiva === 4 ? '#fbbf24' : '#38bdf8';
      let textoEstado = semanaActiva === 4 ? '🏆 Finales' : '⚔️ Programado';
      
      html += `

  function inicializarBucleFixture() {

    if (typeof cargarFixture === "function") {
      cargarFixture();
      setInterval(cargarFixture, 30000); // Sincroniza el Excel en segundo plano cada 30 segundos
    } else if (typeof actualizarMarcadorEnVivo === "function") {
      actualizarMarcadorEnVivo();
      setInterval(actualizarMarcadorEnVivo, 30000);
    }
  }

  // Ejecuta el arranque en cuanto el DOM esté completamente mapeado
